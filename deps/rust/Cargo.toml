[package]
name = "direct-cargo-bazel-deps"
version = "0.0.1"
edition = "2021"
publish = false

# This synthetic crate exists only to drive Cargo dependency resolution for Bazel.
[lib]
path = "fake.rs"

[dependencies]
# dependencies from workerd-cxx
cc = "1"
# clap also includes features needed by workerd
clap = { version = "4", default-features = false, features = ["derive", "error-context", "help", "std", "usage"] }
codespan-reporting = "0.13"
foldhash = "0.2"
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
rustversion = "1"
scratch = "1"
static_assertions = "1"
syn = { version = "2", features = ["full"] }

# We prefer single-digit dependencies to stay up to date as much as possible
# When adding packages here, please only enable features as needed to keep compile times and
# binary sizes bounded.
ada-url = "3"
anyhow = "1"
async-trait = { version = "0", default-features = false }
capnp = "0"
capnpc = "0"
capnp-rpc = "0"
clang-ast = "0"
encoding_rs = "0"
flate2 = "1"
futures = "0"
lol_html_c_api = { git = "https://github.com/cloudflare/lol-html", tag = "v2.7.2" }
nix = "0"
pico-args = "0"
ruff_python_ast = { git = "https://github.com/astral-sh/ruff", tag = "0.12.1" }
ruff_python_parser = { git = "https://github.com/astral-sh/ruff", tag = "0.12.1" }
# param_extractor depends on unbounded_depth feature
serde_json = { version = "1", features = ["unbounded_depth"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
# tokio is huge, let's enable only features when we actually need them.
tokio = { version = "1", default-features = false, features = ["net", "rt", "rt-multi-thread", "time"] }
tracing = { version = "0", default-features = false, features = ["std"] }
swc_common = "21"
swc_ts_fast_strip = "49"

# Hyperlight micro-VM JavaScript worker sandbox. workerd embeds hyperlight-js directly
# (no hyperlight-sandbox wrapper, so no wasmtime/wasi-http stack enters workerd's V8
# runtime). The QuickJS guest is supplied as a prebuilt blob via HYPERLIGHT_JS_RUNTIME_PATH
# (see //deps/rust/patches:hyperlight-js-prebuilt-runtime.patch), so rquickjs/QuickJS never
# enter the host build. x86_64-linux only (KVM-backed VMM); rev-pinned for deterministic
# vendoring.
[target.'cfg(all(target_arch = "x86_64", target_os = "linux"))'.dependencies]
hyperlight-js = { git = "https://github.com/simongdavies/hyperlight-js", rev = "f21ae967a623d67ac21823522a848fe4371d88b0", default-features = false, features = ["kvm"] }

# hyperlight-js depends on hyperlight-js-runtime purely so its build.rs can cross-compile the
# QuickJS guest; workerd supplies a prebuilt guest blob instead and never uses the runtime crate
# on the host. The real crate pulls rquickjs/QuickJS + bindgen (libclang) and cannot build
# hermetically in crate_universe, so substitute an empty stub of the same name+version.
[patch."https://github.com/simongdavies/hyperlight-js"]
hyperlight-js-runtime = { path = "hyperlight-js-runtime-stub" }
